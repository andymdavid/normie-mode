id: charts
status: draft
lines:
  bars: Don't worry about the numbers. Longer bar, better result, except on cost, where a shorter bar means cheaper.
  ci_lines: This little line shows how confident the testers are. When two lines overlap, the models are about as good as each other.
  task_score: This pulls the tests below into one score out of 100. On each test a model scores 100 if it came top and 0 if it came last, and this is the average.
  related_only: None of these tests measure this task exactly, so treat them as a guide rather than a verdict.
  general_only: Nobody tests this task directly yet, so this is the overall ranking. Treat it as a rough guide.
  votes: These come from people comparing two answers side by side without knowing which AI wrote them.
  cost: This is roughly what you'd pay for 1,000 typical requests if you use the AI directly. Chat apps with a monthly plan work differently.
  new_models: These came out in the last few days. Independent testers have only a result or two so far, so for now it's mostly what the makers say.
  normie_test: We ran this test ourselves, so you can see every question and every answer.
  tasks: Pick the job you have in mind. I'll show you which AI looks strongest, how sure we can be, and what to watch out for.
