norm:
  status: draft
  intro: AI is a handy helper for plans, lists and everyday admin. Anything with a price or an opening time needs checking.
  good_at:
    - Drafting an itinerary or a to-do list.
    - Comparing options you give it.
    - Writing polite emails and messages.
  trips_up:
    - Prices, opening hours and availability, which change often.
    - Recommending places that have closed or don't exist.
    - Keeping track of lots of details at once.
  how_to:
    - Check anything time-sensitive on the official website.
    - Give it your budget and dates up front.
    - Use a model that can search the web for anything current.
