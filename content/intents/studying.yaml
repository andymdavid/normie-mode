norm:
  status: draft
  intro: AI can be a very patient tutor. It helps most when it explains, rather than just giving you the answer.
  good_at:
    - Explaining a topic in a different way until it clicks.
    - Making practice questions and quizzes.
    - Checking your working step by step.
  trips_up:
    - Confidently wrong answers on hard problems.
    - Doing the work for you, so you don't learn it.
    - Using different methods from the ones your course expects.
  how_to:
    - Ask it to explain, not just to answer.
    - Have it quiz you on what you've learned.
    - Check anything important against your course notes.
