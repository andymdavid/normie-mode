covers: Finding information, checking facts and pulling it all together.
tests:
  - test: simpleqa-verified
    closeness: related
  - test: hle
    closeness: related
  - test: arena-expert
    closeness: related
norm:
  status: draft
  intro: AI can save you hours of reading, but research is where getting facts right matters most. These tests show which models answer factual and expert questions correctly most often.
  good_at:
    - Summarising long articles and reports.
    - Explaining a topic you're new to.
    - Comparing a few options side by side.
  trips_up:
    - Inventing sources, quotes or statistics.
    - Out-of-date information.
    - Presenting a guess as if it were a fact.
  how_to:
    - Ask for sources, then open them yourself.
    - Use a model that can search the web for anything recent.
    - Double-check any number you plan to repeat.
