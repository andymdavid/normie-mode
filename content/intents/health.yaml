norm:
  status: approved
  intro: AI can help you understand health information, but it isn't a doctor. If something feels wrong, talk to a professional.
  good_at:
    - Explaining medical terms in plain language.
    - Helping you prepare questions for an appointment.
    - Summarising general health information.
  trips_up:
    - It can't examine you or know your history.
    - Rare conditions and unusual symptoms.
    - Sounding reassuring when you should really see someone.
  how_to:
    - Use it to understand, not to diagnose.
    - Take its questions to your doctor or pharmacist.
    - If something feels urgent, call a professional.
