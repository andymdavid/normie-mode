norm:
  status: approved
  intro: AI is a useful extra pair of hands for office work, from drafting to planning. It works best on jobs where you can check what it did.
  good_at:
    - Brainstorming ideas and options.
    - Drafting plans, proposals and summaries.
    - Turning messy thinking into something clear.
  trips_up:
    - Longer jobs with many steps, where small mistakes add up.
    - Making confident assumptions about your business.
    - Numbers that look right but aren't.
  how_to:
    - Give it real context about your business.
    - Break big jobs into smaller pieces.
    - Treat its plan as a starting point, not a decision.
