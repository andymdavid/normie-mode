norm:
  status: draft
  intro: AI can be a good creative sparring partner. Use it to get ideas moving, then make the writing your own.
  good_at:
    - Brainstorming plots, characters and settings.
    - Getting a first draft moving.
    - Trying the same scene in different styles.
  trips_up:
    - Predictable plots and familiar phrases.
    - Keeping characters consistent over a long piece.
    - Sounding like everyone else who used the same AI.
  how_to:
    - Give it your own ideas to build on.
    - Ask for several options, then pick and mix.
    - Rewrite the best bits in your own voice.
