id: academic-research
label: Best AI for academic research
priority: 6
scope: in
parent: research
coverage: partial
covers: Literature reviews, research papers and academic study.
tests:
  - test: arena-expert
    closeness: related
  - test: hle
    closeness: related
  - test: gpqa-diamond
