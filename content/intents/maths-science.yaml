norm:
  status: draft
  intro: AI can work through maths and science problems step by step. Ask it to show its working, because small slips add up.
  good_at:
    - Working through problems step by step.
    - Explaining the idea behind a formula.
    - Checking your answer.
  trips_up:
    - Small slips in long calculations.
    - Harder problems, where it may guess confidently.
    - Units and rounding.
  how_to:
    - Ask it to show every step.
    - If the answer matters, check it another way.
    - For calculations, ask it to use a calculator or code if it can.
