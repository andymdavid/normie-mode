norm:
  status: draft
  intro: AI is handy for understanding legal wording, but it can't give you legal advice. For this page we mostly have people's votes, so treat it as a rough guide.
  good_at:
    - Explaining what a contract clause means in plain English.
    - Spotting parts of a document worth asking about.
    - Drafting a first version of a simple letter.
  trips_up:
    - Laws differ by country and change over time.
    - Inventing cases or rules that sound real.
    - Missing what matters in your particular situation.
  how_to:
    - Tell it which country you're in.
    - Ask it what questions to put to a lawyer.
    - Have anything important checked by a qualified person.
