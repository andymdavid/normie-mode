norm:
  status: draft
  intro: "Good news: AI is now pretty reliable at answering questions about a spreadsheet. The catch is that it can sound sure while using the wrong figures, so it's worth a quick check."
  good_at:
    - Answering questions about your data, like totals, top customers and trends.
    - Writing and explaining formulas.
    - Turning a messy export into a tidy table.
  trips_up:
    - Missing part of a sheet, or adding up the wrong rows.
    - Quietly counting things you'd have left out, like refunds or cancelled orders.
    - Very large files, where it may only look at part of the data.
  how_to:
    - Tell it your rules up front, for example 'only count completed orders'.
    - Ask it to show which rows it used.
    - Check one number you already know before trusting the rest.
