norm:
  status: draft
  intro: AI is good at reading documents for you and pulling out what matters. Always spot-check the details against the original.
  good_at:
    - Summarising long documents.
    - Pulling figures and names into a table.
    - Turning meeting notes into action points.
  trips_up:
    - Skipping parts of very long documents.
    - Mixing up similar figures or names.
    - Scanned documents where the image is poor.
  how_to:
    - Ask it to quote the part of the document it's using.
    - Spot-check a few details against the original.
    - For long files, ask about one section at a time.
