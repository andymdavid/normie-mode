norm:
  status: approved
  intro: AI is good at the thinking and writing behind a presentation. The design side depends more on the app you use.
  good_at:
    - Turning your notes into a clear outline.
    - Writing slide titles and short bullet points.
    - Suggesting a structure for a talk.
  trips_up:
    - Design. Layouts and images depend a lot on the app you use, not just the AI.
    - Making up facts or figures to fill a slide.
    - Too many words on each slide.
  how_to:
    - Start with an outline, and only then ask for slides.
    - Give it your key points. Don't let it invent them.
    - Ask for no more than a few bullet points per slide.
