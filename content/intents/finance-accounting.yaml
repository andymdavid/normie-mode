norm:
  status: draft
  intro: AI can explain financial ideas and help with the numbers, but it isn't an accountant. Check anything you'll file or act on.
  good_at:
    - Explaining financial terms and statements.
    - Setting up a simple budget or forecast.
    - Checking your working on a calculation.
  trips_up:
    - Arithmetic across long lists of numbers.
    - Tax and accounting rules, which vary by country and change often.
    - Sounding certain about a rule it's got slightly wrong.
  how_to:
    - Use it to understand and draft, not to file.
    - Check the totals yourself.
    - For anything to do with tax, confirm with an accountant.
