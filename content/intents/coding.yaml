norm:
  status: draft
  intro: Coding is where AI has been tested most thoroughly, so these charts are some of the most reliable on the site.
  good_at:
    - Writing small scripts and tools from a plain-English description.
    - Explaining code you didn't write.
    - Finding and fixing bugs.
  trips_up:
    - Large projects with lots of moving parts.
    - Code that runs but isn't quite what you asked for.
    - Security details, like passwords and permissions.
  how_to:
    - Describe what you want in small steps.
    - Test the result before you rely on it.
    - Ask it to explain anything you don't understand.
