norm:
  status: approved
  intro: AI is good at getting you past a blank page and tidying up what you've written. Keep your own voice in it.
  good_at:
    - Getting you past a blank page.
    - Tidying up grammar and tone.
    - Shortening long text.
  trips_up:
    - Sounding bland or overly formal.
    - Adding details you didn't ask for.
    - Losing your own voice.
  how_to:
    - Tell it who the reader is and what you want them to do.
    - Give it an example of your own writing to match.
    - Edit the result. Don't just paste it.
