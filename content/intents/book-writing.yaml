norm:
  status: draft
  intro: A book is a long project, and that's where AI finds things hardest. It's a useful helper for planning and editing, but the book should still sound like you.
  good_at:
    - Outlining chapters and plot points.
    - Suggesting edits for pace and clarity.
    - Keeping notes on characters and timelines.
  trips_up:
    - Remembering details across hundreds of pages.
    - Repeating the same phrases and ideas.
    - Writing that feels generic without your input.
  how_to:
    - Work chapter by chapter, not the whole book at once.
    - Keep your own notes on characters and plot to paste in.
    - Use it as an editor as much as a writer.
