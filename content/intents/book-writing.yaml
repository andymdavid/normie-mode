id: book-writing
label: Best AI for writing a book
priority: 6
scope: in
parent: writing
coverage: partial
covers: Planning, drafting and editing a novel or non-fiction book.
tests:
  - test: arena-creative-writing
    closeness: direct
  - test: arena-long-requests
