norm:
  status: draft
  intro: AI can be a real help with a first draft of a CV or cover letter. Just check every fact it writes about you.
  good_at:
    - Turning your experience into clear, tidy wording.
    - Tailoring a CV or cover letter to a job advert.
    - Practising interview questions with you.
  trips_up:
    - Adding skills or achievements you don't have.
    - Sounding generic, like everyone else's application.
    - Getting dates and job titles slightly wrong.
  how_to:
    - Give it your real details and the job advert.
    - Ask it to keep your own words where it can.
    - Read every line out loud before you send it.
